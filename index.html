<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#07090d">
  <title>Звуковая панель</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: #fff;
      background:
        radial-gradient(circle at 50% 0, rgba(44, 63, 94, .22), transparent 42%),
        #07090d;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .sound-panel {
      width: min(100%, 520px);
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .sound-btn {
      position: relative;
      min-height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
      border: 2px solid transparent;
      border-radius: 14px;
      outline: 0;
      color: #fff;
      font: inherit;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 70ms ease, box-shadow 100ms ease, filter 140ms ease;
    }

    .sound-btn:active {
      transform: translateY(4px) scale(.975);
    }

    .sound-btn:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .92);
      outline-offset: 4px;
    }

    .btn-number {
      position: absolute;
      top: 9px;
      left: 11px;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .1em;
      opacity: .72;
    }

    .btn-label {
      font-size: clamp(.9rem, 3.6vw, 1.12rem);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: .07em;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 2px 3px rgba(0, 0, 0, .72);
    }

    .btn-crack {
      background: linear-gradient(145deg, #d97706, #78350f);
      border-color: #fbbf24;
      box-shadow: 0 7px 0 #451a03, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .38);
    }

    .btn-crack.pulsing,
    .btn-crack:active {
      background: linear-gradient(145deg, #f59e0b, #b45309);
      box-shadow: 0 2px 0 #451a03, 0 5px 10px rgba(0, 0, 0, .5), inset 0 1px 3px rgba(255, 255, 255, .55);
    }

    .btn-siren {
      background: linear-gradient(145deg, #b91c1c, #651616);
      border-color: #ef4444;
      box-shadow: 0 7px 0 #450a0a, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-siren.active {
      background: linear-gradient(145deg, #ef2b2b, #991b1b);
      border-color: #fca5a5;
      box-shadow: 0 2px 0 #450a0a, 0 0 26px rgba(239, 68, 68, .72), inset 0 2px 4px rgba(255, 255, 255, .5);
      animation: activePulse .65s infinite alternate;
    }

    .btn-speed {
      background: linear-gradient(145deg, #1d4ed8, #172554);
      border-color: #60a5fa;
      box-shadow: 0 7px 0 #0f183a, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-speed.active,
    .btn-speed:active {
      background: linear-gradient(145deg, #2563eb, #1d4ed8);
      box-shadow: 0 2px 0 #172554, 0 0 24px rgba(37, 99, 235, .72), inset 0 2px 4px rgba(255, 255, 255, .5);
    }

    .btn-two {
      background: linear-gradient(145deg, #0284c7, #0f172a);
      border-color: #38bdf8;
      box-shadow: 0 7px 0 #0c4a6e, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-two.active,
    .btn-two:active {
      background: linear-gradient(145deg, #0ea5e9, #0369a1);
      box-shadow: 0 2px 0 #0c4a6e, 0 0 24px rgba(56, 189, 248, .7), inset 0 2px 4px rgba(255, 255, 255, .5);
    }

    .btn-cracksiren {
      background: linear-gradient(145deg, #15568f, #081d36);
      border-color: #38bdf8;
      box-shadow: 0 7px 0 #040e1a, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-cracksiren.active,
    .btn-cracksiren:active {
      background: linear-gradient(145deg, #0284c7, #0f3661);
      box-shadow: 0 2px 0 #040e1a, 0 0 24px rgba(56, 189, 248, .7), inset 0 2px 4px rgba(255, 255, 255, .5);
    }

    .btn-mic {
      background: linear-gradient(145deg, #067354, #022c22);
      border-color: #10b981;
      box-shadow: 0 7px 0 #06281e, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-mic.active,
    .btn-mic:active {
      background: linear-gradient(145deg, #059669, #047857);
      border-color: #6ee7b7;
      box-shadow: 0 2px 0 #06281e, 0 0 25px rgba(16, 185, 129, .68), inset 0 2px 4px rgba(255, 255, 255, .5);
      animation: activePulse .55s infinite alternate;
    }

    .btn-secret {
      grid-column: 1 / -1;
      background: linear-gradient(145deg, #6b21a8, #3b0764);
      border-color: #c084fc;
      box-shadow: 0 7px 0 #2e1065, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-secret.active,
    .btn-secret:active {
      background: linear-gradient(145deg, #9333ea, #581c87);
      border-color: #e9d5ff;
      box-shadow: 0 2px 0 #2e1065, 0 0 26px rgba(192, 132, 252, .7), inset 0 2px 4px rgba(255, 255, 255, .5);
      animation: activePulse .55s infinite alternate;
    }

    @keyframes activePulse {
      from { filter: brightness(1); }
      to { filter: brightness(1.28); }
    }

    .volume-control {
      margin-top: 26px;
      padding: 18px 20px 20px;
      border: 1px solid #293143;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(26, 31, 41, .94), rgba(13, 16, 23, .96));
      box-shadow: 0 12px 28px rgba(0, 0, 0, .36), inset 0 1px 0 rgba(255, 255, 255, .07);
    }

    .volume-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      color: #aeb8ca;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .volume-value {
      min-width: 68px;
      color: #fff;
      font-size: .9rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
      text-align: right;
    }

    .volume-slider {
      --progress: 19.84%;
      width: 100%;
      height: 26px;
      display: block;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      outline: 0;
      background: transparent;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-runnable-track {
      height: 8px;
      border: 1px solid #303a4d;
      border-radius: 999px;
      background: linear-gradient(90deg, #7c3aed 0 var(--progress), #202633 var(--progress) 100%);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .65);
    }

    .volume-slider::-webkit-slider-thumb {
      width: 24px;
      height: 24px;
      margin-top: -9px;
      appearance: none;
      -webkit-appearance: none;
      border: 3px solid #8b5cf6;
      border-radius: 50%;
      background: #f8fafc;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .65), 0 0 0 5px rgba(139, 92, 246, .15);
      transition: transform 100ms ease, box-shadow 100ms ease;
    }

    .volume-slider::-moz-range-track {
      height: 8px;
      border: 1px solid #303a4d;
      border-radius: 999px;
      background: #202633;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .65);
    }

    .volume-slider::-moz-range-progress {
      height: 8px;
      border-radius: 999px;
      background: #7c3aed;
    }

    .volume-slider::-moz-range-thumb {
      width: 19px;
      height: 19px;
      border: 3px solid #8b5cf6;
      border-radius: 50%;
      background: #f8fafc;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .65), 0 0 0 5px rgba(139, 92, 246, .15);
    }

    .volume-slider:active::-webkit-slider-thumb {
      transform: scale(1.12);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .7), 0 0 0 7px rgba(139, 92, 246, .22);
    }

    .volume-slider:focus-visible::-webkit-slider-thumb {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .load-error {
      display: none;
      margin-top: 14px;
      color: #fca5a5;
      font-size: .78rem;
      line-height: 1.4;
      text-align: center;
    }

    @media (max-width: 430px) {
      body { padding: 16px 12px; }
      .buttons-grid { gap: 11px; }
      .sound-btn { min-height: 96px; border-radius: 12px; }
      .volume-control { margin-top: 22px; padding-inline: 16px; }
    }

    @media (max-height: 680px) and (orientation: landscape) {
      body { align-items: start; }
      .sound-panel { width: min(100%, 760px); }
      .buttons-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .btn-secret { grid-column: span 2; }
      .sound-btn { min-height: 88px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="sound-panel">
    <section class="buttons-grid" aria-label="Звуки">
      <button class="sound-btn btn-crack" id="btnCrack" type="button">
        <span class="btn-number">01</span>
        <span class="btn-label">Крякалка</span>
      </button>
      <button class="sound-btn btn-siren" id="btnSiren" type="button" aria-pressed="false">
        <span class="btn-number">02</span>
        <span class="btn-label">Сирена</span>
      </button>
      <button class="sound-btn btn-speed" id="btnSpeed" type="button">
        <span class="btn-number">03</span>
        <span class="btn-label">Быстрая</span>
      </button>
      <button class="sound-btn btn-two" id="btnTwo" type="button">
        <span class="btn-number">04</span>
        <span class="btn-label">Двойная</span>
      </button>
      <button class="sound-btn btn-cracksiren" id="btnCrackSiren" type="button">
        <span class="btn-number">05</span>
        <span class="btn-label">Кряк-сирена</span>
      </button>
      <button class="sound-btn btn-mic" id="btnMic" type="button">
        <span class="btn-number">06</span>
        <span class="btn-label">Микрофон</span>
      </button>
      <button class="sound-btn btn-secret" id="btnSecret" type="button">
        <span class="btn-number">07</span>
        <span class="btn-label">Секретный сигнал</span>
      </button>
    </section>

    <section class="volume-control" aria-label="Громкость">
      <div class="volume-header">
        <label for="volumeSlider">Громкость</label>
        <output class="volume-value" id="volumeValue" for="volumeSlider">100%</output>
      </div>
      <input
        class="volume-slider"
        id="volumeSlider"
        type="range"
        min="1"
        max="500"
        value="100"
        step="1"
        aria-valuetext="100 процентов"
      >
    </section>

    <p class="load-error" id="loadError" role="alert">
      Не удалось загрузить звуки. Откройте страницу через локальный сервер.
    </p>
  </main>

  <script>
    const AUDIO_FILES = {
      crack: "./crack.mp3",
      siren: "./siren.mp3",
      speed_siren: "./speed_siren.mp3",
      two_siren: "./two_siren.mp3",
      cracksiren: "./cracksiren.mp3",
      koch_v1: "./koch_v1.mp3",
      bratan: "./bratan.mp3",
      golda: "./golda.mp3"
    };

    const SOUND_VOLUMES = {
      crack: 1,
      siren: 1,
      speed_siren: 1,
      two_siren: 1,
      cracksiren: 1,
      koch_v1: 4,
      bratan: 4,
      golda: 1.5
    };

    const SECRET_SOUNDS = new Set(["koch_v1", "bratan", "golda"]);
    const SECRET_FADE_SECONDS = 0.2;

    const audioBuffers = {};
    let audioCtx = null;
    let masterGainNode = null;
    let outputLimiterNode = null;
    let soundBusGainNode = null;
    let volumeMultiplier = 1;

    let sirenSourceNode = null;
    let sirenGainNode = null;
    let isSirenActive = false;
    let lastTwoSirenTime = 0;
    let lastCrackSirenTime = 0;
    let activeTwoSirenCount = 0;
    let activeCrackSirenCount = 0;

    let currentSecretSource = null;
    let currentSecretGain = null;
    let currentSecretStartTime = 0;
    let currentSecretDuration = 0;

    let micStream = null;
    let micSourceNode = null;
    let micGainNode = null;
    let isMicActive = false;

    const btnCrack = document.getElementById("btnCrack");
    const btnSiren = document.getElementById("btnSiren");
    const btnSpeed = document.getElementById("btnSpeed");
    const btnTwo = document.getElementById("btnTwo");
    const btnCrackSiren = document.getElementById("btnCrackSiren");
    const btnMic = document.getElementById("btnMic");
    const btnSecret = document.getElementById("btnSecret");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumeValue = document.getElementById("volumeValue");
    const loadError = document.getElementById("loadError");

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();

        masterGainNode = audioCtx.createGain();
        masterGainNode.gain.value = volumeMultiplier;

        outputLimiterNode = audioCtx.createDynamicsCompressor();
        outputLimiterNode.threshold.value = -3;
        outputLimiterNode.knee.value = 6;
        outputLimiterNode.ratio.value = 12;
        outputLimiterNode.attack.value = 0.003;
        outputLimiterNode.release.value = 0.18;

        masterGainNode.connect(outputLimiterNode);
        outputLimiterNode.connect(audioCtx.destination);

        soundBusGainNode = audioCtx.createGain();
        soundBusGainNode.gain.value = 1;
        soundBusGainNode.connect(masterGainNode);
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function setMasterVolume(percent) {
      volumeMultiplier = percent / 100;
      volumeValue.value = `${percent}%`;
      volumeValue.textContent = `${percent}%`;
      volumeSlider.setAttribute("aria-valuetext", `${percent} процентов`);

      const progress = ((percent - 1) / (500 - 1)) * 100;
      volumeSlider.style.setProperty("--progress", `${progress}%`);

      if (masterGainNode && audioCtx) {
        const now = audioCtx.currentTime;
        masterGainNode.gain.cancelScheduledValues(now);
        masterGainNode.gain.setTargetAtTime(volumeMultiplier, now, 0.015);
      }
    }

    async function preloadAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const tempCtx = new AudioContextClass();

      try {
        await Promise.all(Object.entries(AUDIO_FILES).map(async ([key, path]) => {
          const response = await fetch(path);
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${path}`);
          const data = await response.arrayBuffer();
          audioBuffers[key] = await tempCtx.decodeAudioData(data);
        }));
      } catch (error) {
        console.error(error);
        loadError.style.display = "block";
      } finally {
        await tempCtx.close();
      }
    }

    function playSingleSoundWithFade(bufferKey, onendedCallback) {
      if (!audioCtx || !audioBuffers[bufferKey]) return null;

      const source = audioCtx.createBufferSource();
      const gainNode = audioCtx.createGain();
      const now = audioCtx.currentTime;
      const duration = audioBuffers[bufferKey].duration;
      const fadeIn = 0.015;
      const fadeOut = SECRET_SOUNDS.has(bufferKey) ? SECRET_FADE_SECONDS : 0.18;
      const targetVolume = SOUND_VOLUMES[bufferKey] || 1;

      source.buffer = audioBuffers[bufferKey];
      gainNode.gain.setValueAtTime(0.0001, now);
      gainNode.gain.linearRampToValueAtTime(targetVolume, now + fadeIn);

      if (duration > fadeIn + fadeOut) {
        gainNode.gain.setValueAtTime(targetVolume, now + duration - fadeOut);
        gainNode.gain.linearRampToValueAtTime(0.0001, now + duration);
      }

      source.connect(gainNode);
      gainNode.connect(soundBusGainNode);
      source.onended = () => {
        try { source.disconnect(); } catch {}
        try { gainNode.disconnect(); } catch {}
        onendedCallback?.();
      };
      source.start(now);

      return { source, gainNode };
    }

    function fadeOutSecret(source, gainNode) {
      if (!source || !gainNode || !audioCtx) return;
      const now = audioCtx.currentTime;

      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(Math.max(gainNode.gain.value, 0.0001), now);
      gainNode.gain.linearRampToValueAtTime(0.0001, now + SECRET_FADE_SECONDS);
      try { source.stop(now + SECRET_FADE_SECONDS); } catch {}
    }

    function triggerSecretSignal(event) {
      event?.preventDefault();
      initAudioContext();

      if (currentSecretSource) {
        const elapsed = audioCtx.currentTime - currentSecretStartTime;
        if (elapsed < currentSecretDuration * 0.7) return;

        const oldSource = currentSecretSource;
        const oldGain = currentSecretGain;
        currentSecretSource = null;
        currentSecretGain = null;
        fadeOutSecret(oldSource, oldGain);
      }

      const options = ["koch_v1", "golda", "bratan"];
      const soundKey = options[Math.floor(Math.random() * options.length)];
      btnSecret.classList.add("active");

      const sound = playSingleSoundWithFade(soundKey, () => {
        if (currentSecretSource === sound?.source) {
          currentSecretSource = null;
          currentSecretGain = null;
          currentSecretStartTime = 0;
          currentSecretDuration = 0;
          btnSecret.classList.remove("active");
        }
      });

      if (sound) {
        currentSecretSource = sound.source;
        currentSecretGain = sound.gainNode;
        currentSecretStartTime = audioCtx.currentTime;
        currentSecretDuration = audioBuffers[soundKey].duration;
      }
    }

    function triggerCrack(event) {
      event?.preventDefault();
      initAudioContext();
      if (!audioBuffers.crack) return;

      playSingleSoundWithFade("crack");
      btnCrack.classList.add("pulsing");
      setTimeout(() => btnCrack.classList.remove("pulsing"), 150);
    }

    function toggleSiren(event) {
      event?.preventDefault();
      initAudioContext();
      if (!audioBuffers.siren) return;

      if (isSirenActive) {
        if (sirenSourceNode && sirenGainNode) {
          const now = audioCtx.currentTime;
          const fadeOut = 0.2;
          const sourceToStop = sirenSourceNode;
          const gainToDisconnect = sirenGainNode;

          gainToDisconnect.gain.cancelScheduledValues(now);
          gainToDisconnect.gain.setValueAtTime(Math.max(gainToDisconnect.gain.value, 0.0001), now);
          gainToDisconnect.gain.linearRampToValueAtTime(0.0001, now + fadeOut);
          try { sourceToStop.stop(now + fadeOut); } catch {}

          setTimeout(() => {
            try { sourceToStop.disconnect(); } catch {}
            try { gainToDisconnect.disconnect(); } catch {}
          }, 250);
        }

        sirenSourceNode = null;
        sirenGainNode = null;
        isSirenActive = false;
      } else {
        const now = audioCtx.currentTime;
        sirenGainNode = audioCtx.createGain();
        sirenGainNode.gain.setValueAtTime(0.0001, now);
        sirenGainNode.gain.linearRampToValueAtTime(SOUND_VOLUMES.siren, now + 0.05);

        sirenSourceNode = audioCtx.createBufferSource();
        sirenSourceNode.buffer = audioBuffers.siren;
        sirenSourceNode.loop = true;
        sirenSourceNode.connect(sirenGainNode);
        sirenGainNode.connect(soundBusGainNode);
        sirenSourceNode.start(now);
        isSirenActive = true;
      }

      btnSiren.classList.toggle("active", isSirenActive);
      btnSiren.setAttribute("aria-pressed", String(isSirenActive));
    }

    function triggerSpeedSiren(event) {
      event?.preventDefault();
      initAudioContext();
      if (!audioBuffers.speed_siren) return;

      btnSpeed.classList.add("active");
      playSingleSoundWithFade("speed_siren", () => btnSpeed.classList.remove("active"));
    }

    function triggerTwoSiren(event) {
      event?.preventDefault();
      initAudioContext();
      if (!audioBuffers.two_siren) return;

      const now = Date.now();
      if (now - lastTwoSirenTime < 500) return;
      lastTwoSirenTime = now;
      activeTwoSirenCount += 1;
      btnTwo.classList.add("active");

      playSingleSoundWithFade("two_siren", () => {
        activeTwoSirenCount = Math.max(0, activeTwoSirenCount - 1);
        if (activeTwoSirenCount === 0) btnTwo.classList.remove("active");
      });
    }

    function triggerCrackSiren(event) {
      event?.preventDefault();
      initAudioContext();
      if (!audioBuffers.cracksiren) return;

      const now = Date.now();
      if (now - lastCrackSirenTime < 600) return;
      lastCrackSirenTime = now;
      activeCrackSirenCount += 1;
      btnCrackSiren.classList.add("active");

      playSingleSoundWithFade("cracksiren", () => {
        activeCrackSirenCount = Math.max(0, activeCrackSirenCount - 1);
        if (activeCrackSirenCount === 0) btnCrackSiren.classList.remove("active");
      });
    }

    async function startMicrophone(event) {
      event?.preventDefault();
      initAudioContext();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      if (isMicActive) return;

      isMicActive = true;
      btnMic.classList.add("active");

      try {
        if (!micStream) {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });
        }

        if (!micSourceNode) {
          micSourceNode = audioCtx.createMediaStreamSource(micStream);

          micGainNode = audioCtx.createGain();
          micGainNode.gain.value = 1;

          micSourceNode.connect(micGainNode);
          micGainNode.connect(masterGainNode);
        } else {
          micGainNode.gain.setValueAtTime(1, audioCtx.currentTime);
        }

        micStream.getAudioTracks().forEach(track => { track.enabled = true; });
      } catch (error) {
        console.error("Microphone access error:", error);
        stopMicrophone();
      }
    }

    function stopMicrophone(event) {
      event?.preventDefault();
      if (!isMicActive) return;

      isMicActive = false;
      btnMic.classList.remove("active");

      if (micGainNode && audioCtx) {
        micGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
        micGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      }

    }

    btnCrack.addEventListener("pointerdown", triggerCrack);
    btnSiren.addEventListener("pointerdown", toggleSiren);
    btnSpeed.addEventListener("pointerdown", triggerSpeedSiren);
    btnTwo.addEventListener("pointerdown", triggerTwoSiren);
    btnCrackSiren.addEventListener("pointerdown", triggerCrackSiren);
    btnSecret.addEventListener("pointerdown", triggerSecretSignal);

    btnMic.addEventListener("pointerdown", startMicrophone);
    btnMic.addEventListener("pointerup", stopMicrophone);
    btnMic.addEventListener("pointercancel", stopMicrophone);
    btnMic.addEventListener("pointerleave", stopMicrophone);
    btnMic.addEventListener("contextmenu", event => event.preventDefault());

    volumeSlider.addEventListener("input", () => {
      setMasterVolume(Number(volumeSlider.value));
    });

    setMasterVolume(100);
    window.addEventListener("DOMContentLoaded", preloadAudio);
  </script>
</body>
</html>
