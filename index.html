<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Пульт СГУ ДПС</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    body {
      background-color: #050608;
      background-image: radial-gradient(ellipse at 50% 20%, rgba(13, 71, 161, .25) 0, rgba(0, 0, 0, .95) 70%), repeating-linear-gradient(0deg, rgba(0, 0, 0, .5) 0, rgba(0, 0, 0, .5) 1px, transparent 1px, transparent 3px);
      color: #fff;
      font-family: 'Arial Black', Impact, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    .strobe-bar {
      width: 100%;
      max-width: 460px;
      height: 16px;
      border-radius: 8px 8px 0 0;
      display: flex;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, .9);
      border: 2px solid #1a202c;
      border-bottom: none;
    }
    .strobe-left { flex: 1; background: #7f1d1d; transition: background .1s ease; }
    .strobe-right { flex: 1; background: #1e3a8a; transition: background .1s ease; }
    body.strobe-active .strobe-left { animation: flashRed .4s infinite alternate; }
    body.strobe-active .strobe-right { animation: flashBlue .4s infinite alternate-reverse; }
    @keyframes flashRed { 0% { background: red; box-shadow: 0 0 25px red; } 100% { background: #500000; box-shadow: none; } }
    @keyframes flashBlue { 0% { background: #05f; box-shadow: 0 0 25px #05f; } 100% { background: #015; box-shadow: none; } }
    .sgu-console {
      width: 100%;
      max-width: 460px;
      background: #0f1218;
      background-image: linear-gradient(180deg, #181d26 0, #0b0d12 100%);
      border: 3px solid #2a3242;
      border-radius: 0 0 16px 16px;
      padding: 20px 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, .95), inset 0 2px 3px rgba(255, 255, 255, .15), inset 0 -3px 8px rgba(0, 0, 0, .9);
      position: relative;
    }
    .screw {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4b5563, #1f2937);
      border: 1px solid #111827;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, .3);
    }
    .screw::after { content: ''; position: absolute; top: 4px; left: 1px; width: 8px; height: 2px; background: #111827; }
    .screw-tl { top: 8px; left: 8px; }
    .screw-tr { top: 8px; right: 8px; }
    .screw-bl { bottom: 8px; left: 8px; }
    .screw-br { bottom: 8px; right: 8px; }
    .dps-header {
      background: linear-gradient(90deg, #0d47a1 0, #1565c0 50%, #0d47a1 100%);
      border: 2px solid #1e88e5;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .5), inset 0 1px 1px rgba(255, 255, 255, .3);
      position: relative;
      overflow: hidden;
    }
    .dps-header::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: #d32f2f; }
    .dps-header::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: #d32f2f; }
    .dps-title { display: flex; flex-direction: column; padding-left: 6px; }
    .dps-title h1 { font-size: 1.4rem; letter-spacing: 3px; color: #fff; text-transform: uppercase; text-shadow: 2px 2px 0 #000; }
    .dps-title span { font-size: .65rem; letter-spacing: 2px; color: #ffeb3b; font-weight: 700; text-transform: uppercase; }
    .status-leds { display: flex; gap: 10px; }
    .led-box { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .led-label { font-size: .55rem; color: #90caf9; font-weight: 700; letter-spacing: 1px; }
    .led { width: 12px; height: 12px; border-radius: 50%; background: #151c24; border: 1px solid #000; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .9); transition: all .15s ease; }
    .led.green.on { background: #0f4; box-shadow: 0 0 12px #0f4, inset 0 -1px 2px rgba(0, 0, 0, .4); }
    .led.red.on { background: #f03; box-shadow: 0 0 14px #f03, inset 0 -1px 2px rgba(0, 0, 0, .4); }
    .led.blue.on { background: #08f; box-shadow: 0 0 14px #08f, inset 0 -1px 2px rgba(0, 0, 0, .4); }
    .buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 6px; margin-bottom: 16px; }
    .sgu-btn { position: relative; height: 110px; border-radius: 12px; border: 2px solid transparent; outline: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; gap: 4px; transition: transform 50ms ease, box-shadow 50ms ease, filter .15s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .sgu-btn:active { transform: translateY(4px) scale(.97); }
    .btn-badge { position: absolute; top: 6px; left: 10px; font-size: .7rem; font-weight: 700; opacity: .7; letter-spacing: 1px; }
    .btn-main-text { font-size: 1.15rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; text-shadow: 2px 2px 2px rgba(0, 0, 0, .9); line-height: 1.1; text-align: center; }
    .btn-sub-text { font-size: .62rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: .85; }
    .btn-crack { background: linear-gradient(145deg, #d97706 0, #92400e 100%); color: #fff; border-color: #fbbf24; box-shadow: 0 7px 0 #451a03, 0 10px 15px rgba(0, 0, 0, .8), inset 0 1px 2px rgba(255, 255, 255, .4); }
    .btn-crack.pulsing, .btn-crack:active { background: linear-gradient(145deg, #f59e0b 0, #b45309 100%); box-shadow: 0 2px 0 #451a03, 0 4px 8px rgba(0, 0, 0, .8), inset 0 1px 3px rgba(255, 255, 255, .6); }
    .btn-siren { background: linear-gradient(145deg, #b91c1c 0, #7f1d1d 100%); color: #fff; border-color: #ef4444; box-shadow: 0 7px 0 #450a0a, 0 10px 15px rgba(0, 0, 0, .8), inset 0 1px 2px rgba(255, 255, 255, .4); }
    .btn-siren.active { background: linear-gradient(145deg, #dc2626 0, #991b1b 100%); border-color: #f88; box-shadow: 0 2px 0 #450a0a, 0 0 25px rgba(239, 68, 68, .95), inset 0 2px 4px rgba(255, 255, 255, .6); animation: pulseRedBtn .6s infinite alternate; }
    @keyframes pulseRedBtn { 0% { filter: brightness(1); } 100% { filter: brightness(1.3); } }
    .btn-speed { background: linear-gradient(145deg, #1d4ed8 0, #1e3a8a 100%); color: #fff; border-color: #60a5fa; box-shadow: 0 7px 0 #172554, 0 10px 15px rgba(0, 0, 0, .8), inset 0 1px 2px rgba(255, 255, 255, .4); }
    .btn-speed.active, .btn-speed:active { background: linear-gradient(145deg, #2563eb 0, #1d4ed8 100%); box-shadow: 0 2px 0 #172554, 0 0 22px rgba(37, 99, 235, .95), inset 0 2px 4px rgba(255, 255, 255, .6); }
    .btn-two { background: linear-gradient(145deg, #0284c7 0, #0f172a 100%); color: #fff; border-color: #38bdf8; box-shadow: 0 7px 0 #0c4a6e, 0 10px 15px rgba(0, 0, 0, .8), inset 0 1px 2px rgba(255, 255, 255, .4); }
    .btn-two.active, .btn-two:active { background: linear-gradient(145deg, #0369a1 0, #0284c7 100%); box-shadow: 0 2px 0 #0c4a6e, 0 0 22px rgba(56, 189, 248, .95), inset 0 2px 4px rgba(255, 255, 255, .6); }
    .btn-cracksiren { background: linear-gradient(145deg, #0f3661 0, #081d36 100%); color: #fff; border-color: #38bdf8; box-shadow: 0 7px 0 #040e1a, 0 10px 15px rgba(0, 0, 0, .8), inset 0 1px 2px rgba(255, 255, 255, .4); }
    .btn-cracksiren.active, .btn-cracksiren:active { background: linear-gradient(145deg, #0284c7 0, #0f3661 100%); box-shadow: 0 2px 0 #040e1a, 0 0 22px rgba(56, 189, 248, .95), inset 0 2px 4px rgba(255, 255, 255, .6); }
    .btn-mic { background: linear-gradient(145deg, #064e3b 0, #022c22 100%); color: #fff; border-color: #10b981; box-shadow: 0 7px 0 #06281e, 0 10px 15px rgba(0, 0, 0, .8), inset 0 1px 2px rgba(255, 255, 255, .4); }
    .btn-mic.active, .btn-mic:active { background: linear-gradient(145deg, #059669 0, #047857 100%); border-color: #34d399; box-shadow: 0 2px 0 #06281e, 0 0 25px rgba(16, 185, 129, .95), inset 0 2px 4px rgba(255, 255, 255, .6); animation: pulseGreenBtn .5s infinite alternate; }
    @keyframes pulseGreenBtn { 0% { filter: brightness(1); } 100% { filter: brightness(1.35); } }
    .btn-secret { grid-column: 1 / -1; background: linear-gradient(145deg, #581c87 0, #3b0764 100%); color: #fff; border-color: #c084fc; box-shadow: 0 7px 0 #2e1065, 0 10px 15px rgba(0, 0, 0, .8), inset 0 1px 2px rgba(255, 255, 255, .4); }
    .btn-secret.active, .btn-secret:active { background: linear-gradient(145deg, #7e22ce 0, #581c87 100%); border-color: #e9d5ff; box-shadow: 0 2px 0 #2e1065, 0 0 25px rgba(192, 132, 252, .95), inset 0 2px 4px rgba(255, 255, 255, .6); animation: pulsePurpleBtn .5s infinite alternate; }
    @keyframes pulsePurpleBtn { 0% { filter: brightness(1); } 100% { filter: brightness(1.35); } }

    .cors-box { display: none; background: #3f0e0e; border: 1px solid #ef4444; color: #fca5a5; padding: 8px 12px; border-radius: 6px; font-size: .72rem; margin-top: 10px; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>
  <div class="strobe-bar">
    <div class="strobe-left"></div>
    <div class="strobe-right"></div>
  </div>
  <div class="sgu-console">
    <div class="screw screw-tl"></div>
    <div class="screw screw-tr"></div>
    <div class="screw screw-bl"></div>
    <div class="screw screw-br"></div>
    <div class="dps-header">
      <div class="dps-title">
        <h1>ДПС ГИБДД</h1>
        <span>СПЕЦСИГНАЛ СГУ-120</span>
      </div>
      <div class="status-leds">
        <div class="led-box"><div class="led green on" id="ledPower"></div><span class="led-label">СЕТЬ</span></div>
        <div class="led-box"><div class="led red" id="ledSiren"></div><span class="led-label">СИРЕНА</span></div>
        <div class="led-box"><div class="led blue" id="ledAudio"></div><span class="led-label">ЗВУК</span></div>
      </div>
    </div>

    <div class="buttons-grid">
      <button class="sgu-btn btn-crack interactive-control" id="btnCrack">
        <span class="btn-badge">01</span>
        <span class="btn-main-text">КРЯКАЛКА</span>
      </button>
      <button class="sgu-btn btn-siren interactive-control" id="btnSiren">
        <span class="btn-badge">02</span>
        <span class="btn-main-text">СИРЕНА</span>
      </button>
      <button class="sgu-btn btn-speed interactive-control" id="btnSpeed">
        <span class="btn-badge">03</span>
        <span class="btn-main-text">БЫСТРАЯ</span>
      </button>
      <button class="sgu-btn btn-two interactive-control" id="btnTwo">
        <span class="btn-badge">04</span>
        <span class="btn-main-text">ДВОЙНАЯ</span>
      </button>
      <button class="sgu-btn btn-cracksiren interactive-control" id="btnCrackSiren">
        <span class="btn-badge">05</span>
        <span class="btn-main-text">КРЯК-СИРЕНА</span>
      </button>
      <button class="sgu-btn btn-mic interactive-control" id="btnMic">
        <span class="btn-badge">06</span>
        <span class="btn-main-text">МИКРОФОН</span>
        <span class="btn-sub-text">УДЕРЖИВАЙТЕ</span>
      </button>
      <button class="sgu-btn btn-secret interactive-control" id="btnSecret">
        <span class="btn-badge">07</span>
        <span class="btn-main-text">СЕКРЕТНЫЙ СИГНАЛ</span>
      </button>
    </div>
    <div class="cors-box" id="corsBox">⚠️ Ошибка чтения локальных файлов по file://. Запустите через локальный сервер (Live Server / python -m http.server).</div>
  </div>

  <script>
    const AUDIO_FILES = {
      crack: "./crack.mp3",
      siren: "./siren.mp3",
      speed_siren: "./speed_siren.mp3",
      two_siren: "./two_siren.mp3",
      cracksiren: "./cracksiren.mp3",
      koch_v1: "./koch_v1.mp3",
      bratan: "./bratan.mp3",
      golda: "./golda.mp3"
    };

    const SOUND_VOLUMES = {
      crack: 1.0,
      siren: 1.0,
      speed_siren: 1.0,
      two_siren: 1.0,
      cracksiren: 1.0,
      koch_v1: 4.0,
      bratan: 4.0,
      golda: 1.5
    };

    let audioCtx = null;
    let masterGainNode = null;
    let sguSoundsGainNode = null; // Bus for sirens and sounds (allows ducking when speaking)
    const audioBuffers = {};

    let sirenSourceNode = null;
    let sirenGainNode = null;
    let isSirenActive = false;
    let lastTwoSirenTime = 0;
    let lastCrackSirenTime = 0;

    // Microphone SGU nodes
    let micStream = null;
    let micSourceNode = null;
    let micGainNode = null;
    let micHighpass = null;
    let micLowpass = null;
    let micPresence = null;
    let micCompressor = null;
    let micDistortion = null;
    let isMicActive = false;

    const ledAudio = document.getElementById("ledAudio");
    const ledSiren = document.getElementById("ledSiren");
    const corsBox = document.getElementById("corsBox");
    const lcdStatusText = document.getElementById("lcdStatusText");
    const btnCrack = document.getElementById("btnCrack");
    const btnSiren = document.getElementById("btnSiren");
    const btnSpeed = document.getElementById("btnSpeed");
    const btnTwo = document.getElementById("btnTwo");
    const btnCrackSiren = document.getElementById("btnCrackSiren");
    const btnMic = document.getElementById("btnMic");
    const btnSecret = document.getElementById("btnSecret");

    let currentSecretSource = null;
    let currentSecretGain = null;
    let currentSecretKey = null;
    let currentSecretStartTime = 0;
    let currentSecretDuration = 0;

    function playSecretBuffer(bufferKey, onEndedCallback) {
      if (!audioCtx || !audioBuffers[bufferKey]) return;

      if (currentSecretSource) {
        try { currentSecretSource.stop(); } catch (e) {}
        try { currentSecretSource.disconnect(); } catch (e) {}
        currentSecretSource = null;
      }
      if (currentSecretGain) {
        try { currentSecretGain.disconnect(); } catch (e) {}
        currentSecretGain = null;
      }

      const sound = playSingleSoundWithFade(bufferKey, () => {
        currentSecretSource = null;
        currentSecretGain = null;
        currentSecretKey = null;
        currentSecretStartTime = 0;
        currentSecretDuration = 0;
        btnSecret.classList.remove("active");
        if (!isSirenActive && !isMicActive && lcdStatusText) {
          lcdStatusText.textContent = "СГУ ДПС ГОТОВ К РАБОТЕ";
        }
        if (onEndedCallback) onEndedCallback();
      });

      if (sound) {
        currentSecretSource = sound.source;
        currentSecretGain = sound.gainNode;
        currentSecretKey = bufferKey;
        currentSecretStartTime = audioCtx.currentTime;
        currentSecretDuration = audioBuffers[bufferKey].duration;
      }
    }

    function triggerSecretSignal(e) {
      if (e && e.preventDefault) e.preventDefault();
      initAudioContext();

      const now = audioCtx.currentTime;

      if (currentSecretSource && currentSecretDuration > 0) {
        const elapsed = now - currentSecretStartTime;
        if (elapsed < currentSecretDuration * 0.7) {
          return;
        }
      }

      const options = ["koch_v1", "golda", "bratan"];
      const soundToPlay = options[Math.floor(Math.random() * options.length)];

      if (lcdStatusText) {
        const names = {
          koch_v1: "СЕКРЕТНЫЙ СИГНАЛ: KOCH",
          golda: "СЕКРЕТНЫЙ СИГНАЛ: ГОЛДА",
          bratan: "СЕКРЕТНЫЙ СИГНАЛ: БРАТАН"
        };
        lcdStatusText.textContent = names[soundToPlay] || "СЕКРЕТНЫЙ СИГНАЛ";
      }

      btnSecret.classList.add("active");
      playSecretBuffer(soundToPlay);
    }

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        masterGainNode = audioCtx.createGain();
        masterGainNode.gain.value = 1.0;
        masterGainNode.connect(audioCtx.destination);

        // Sub-bus for sirens & sound effects to enable audio ducking while mic is active
        sguSoundsGainNode = audioCtx.createGain();
        sguSoundsGainNode.gain.value = 1.0;
        sguSoundsGainNode.connect(masterGainNode);
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    async function preloadAudio() {
      const keys = Object.keys(AUDIO_FILES);
      const tempCtx = new (window.AudioContext || window.webkitAudioContext)();

      for (const key of keys) {
        try {
          const res = await fetch(AUDIO_FILES[key]);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const bufferData = await res.arrayBuffer();
          audioBuffers[key] = await tempCtx.decodeAudioData(bufferData);
        } catch (err) {
          console.error(err);
          if (window.location.protocol === "file:") {
            corsBox.style.display = "block";
          }
          return;
        }
      }
      tempCtx.close();
      ledAudio.classList.add("on");
    }

    function updateStrobeState() {
      if (isSirenActive) {
        document.body.classList.add("strobe-active");
      } else {
        document.body.classList.remove("strobe-active");
      }
    }

    function playSingleSoundWithFade(bufferKey, onendedCallback) {
      if (!audioCtx || !audioBuffers[bufferKey]) return null;

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffers[bufferKey];

      const gainNode = audioCtx.createGain();
      const now = audioCtx.currentTime;
      const duration = source.buffer.duration;

      const fadeIn = 0.015;
      const fadeOut = 0.18;

      const targetVol = SOUND_VOLUMES[bufferKey] || 1.0;

      gainNode.gain.setValueAtTime(0.0001, now);
      gainNode.gain.linearRampToValueAtTime(targetVol, now + fadeIn);

      if (duration > fadeIn + fadeOut) {
        gainNode.gain.setValueAtTime(targetVol, now + duration - fadeOut);
        gainNode.gain.linearRampToValueAtTime(0.0001, now + duration);
      }

      source.connect(gainNode);
      gainNode.connect(sguSoundsGainNode); // Connect sound effects to duckable sguSoundsGainNode bus

      source.onended = () => {
        try { source.disconnect(); } catch (e) {}
        try { gainNode.disconnect(); } catch (e) {}
        if (onendedCallback) onendedCallback();
      };

      source.start(now);
      return { source, gainNode };
    }

    function triggerCrack(e) {
      if (e && e.preventDefault(), initAudioContext(), !audioBuffers.crack) return;
      playSingleSoundWithFade("crack");
      btnCrack.classList.add("pulsing");
      setTimeout(() => btnCrack.classList.remove("pulsing"), 150);
      if (lcdStatusText) lcdStatusText.textContent = "СИГНАЛ: КРЯКАЛКА";
    }

    function toggleSiren(e) {
      if (e && e.preventDefault(), initAudioContext(), !audioBuffers.siren) return;

      if (isSirenActive) {
        if (sirenSourceNode && sirenGainNode) {
          const fadeOutTime = 0.25;
          const now = audioCtx.currentTime;
          const nodeToStop = sirenSourceNode;
          const gainToDisconnect = sirenGainNode;

          gainToDisconnect.gain.setValueAtTime(gainToDisconnect.gain.value, now);
          gainToDisconnect.gain.linearRampToValueAtTime(0.0001, now + fadeOutTime);

          try { nodeToStop.stop(now + fadeOutTime); } catch (e) {}
          setTimeout(() => {
            try { nodeToStop.disconnect(); } catch (e) {}
            try { gainToDisconnect.disconnect(); } catch (e) {}
          }, fadeOutTime * 1000 + 50);

          sirenSourceNode = null;
          sirenGainNode = null;
        }
        isSirenActive = false;
        btnSiren.classList.remove("active");
        ledSiren.classList.remove("on");
        if (lcdStatusText) lcdStatusText.textContent = "СИРЕНА ВЫКЛЮЧЕНА";
      } else {
        const now = audioCtx.currentTime;
        sirenGainNode = audioCtx.createGain();
        sirenGainNode.gain.setValueAtTime(0.0001, now);
        sirenGainNode.gain.linearRampToValueAtTime(1.0, now + 0.05);

        sirenSourceNode = audioCtx.createBufferSource();
        sirenSourceNode.buffer = audioBuffers.siren;
        sirenSourceNode.loop = true;

        sirenSourceNode.connect(sirenGainNode);
        sirenGainNode.connect(sguSoundsGainNode); // Connect siren to duckable sguSoundsGainNode bus
        sirenSourceNode.start(now);

        isSirenActive = true;
        btnSiren.classList.add("active");
        ledSiren.classList.add("on");
        if (lcdStatusText) lcdStatusText.textContent = "РЕЖИМ: ОСНОВНАЯ СИРЕНА";
      }
      updateStrobeState();
    }

    function triggerSpeedSiren(e) {
      if (e && e.preventDefault(), initAudioContext(), !audioBuffers.speed_siren) return;
      btnSpeed.classList.add("active");
      if (lcdStatusText) lcdStatusText.textContent = "РЕЖИМ: БЫСТРАЯ СИРЕНА";
      playSingleSoundWithFade("speed_siren", () => {
        btnSpeed.classList.remove("active");
        if (!isSirenActive && !isMicActive && lcdStatusText) lcdStatusText.textContent = "СГУ ДПС ГОТОВ К РАБОТЕ";
      });
    }

    let activeTwoSirenCount = 0;

    function triggerTwoSiren(e) {
      if (e && e.preventDefault(), initAudioContext(), !audioBuffers.two_siren) return;
      const t = Date.now();
      if (t - lastTwoSirenTime < 500) return;
      lastTwoSirenTime = t;

      btnTwo.classList.add("active");
      if (lcdStatusText) lcdStatusText.textContent = "РЕЖИМ: ДВОЙНАЯ СИРЕНА";

      activeTwoSirenCount++;
      playSingleSoundWithFade("two_siren", () => {
        activeTwoSirenCount--;
        if (activeTwoSirenCount <= 0) {
          activeTwoSirenCount = 0;
          btnTwo.classList.remove("active");
          if (!isSirenActive && !isMicActive && lcdStatusText) lcdStatusText.textContent = "СГУ ДПС ГОТОВ К РАБОТЕ";
        }
      });
    }

    let activeCrackSirenCount = 0;

    function triggerCrackSiren(e) {
      if (e && e.preventDefault(), initAudioContext(), !audioBuffers.cracksiren) return;
      const t = Date.now();
      if (t - lastCrackSirenTime < 600) return;
      lastCrackSirenTime = t;

      btnCrackSiren.classList.add("active");
      if (lcdStatusText) lcdStatusText.textContent = "РЕЖИМ: КРЯК-СИРЕНА";

      activeCrackSirenCount++;
      playSingleSoundWithFade("cracksiren", () => {
        activeCrackSirenCount--;
        if (activeCrackSirenCount <= 0) {
          activeCrackSirenCount = 0;
          btnCrackSiren.classList.remove("active");
          if (!isSirenActive && !isMicActive && lcdStatusText) lcdStatusText.textContent = "СГУ ДПС ГОТОВ К РАБОТЕ";
        }
      });
    }

    // Smooth Mobile & PC Compatible SGU Horn Saturation Curve
    function createBalancedSguDistortionCurve() {
      const samples = 44100;
      const curve = new Float32Array(samples);
      const drive = 2.2; // Smooth soft-clipping for mobile microphone compatibility
      for (let i = 0; i < samples; i++) {
        const x = (i * 2) / samples - 1;
        curve[i] = Math.tanh(x * drive);
      }
      return curve;
    }

    async function startMicrophone(e) {
      if (e && e.preventDefault) e.preventDefault();
      initAudioContext();

      if (audioCtx && audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      if (isMicActive) return;
      isMicActive = true;
      btnMic.classList.add("active");
      if (lcdStatusText) lcdStatusText.textContent = "🎤 ГРОМКАЯ СВЯЗЬ: МИКРОФОН АКТИВЕН";

      // Duck background siren and sounds volume smoothly to 20% while mic is active
      if (sguSoundsGainNode && audioCtx) {
        const now = audioCtx.currentTime;
        const currentVal = sguSoundsGainNode.gain.value;
        sguSoundsGainNode.gain.cancelScheduledValues(now);
        sguSoundsGainNode.gain.setValueAtTime(currentVal, now);
        sguSoundsGainNode.gain.linearRampToValueAtTime(0.2, now + 0.1);
      }

      try {
        if (!micStream) {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false // Disables mobile OS AGC volume pumping
            }
          });
        }

        if (!micSourceNode && micStream) {
          micSourceNode = audioCtx.createMediaStreamSource(micStream);

          // 1. Input Peak Limiter (Protects mobile phone mics from hard digital clipping)
          const inputLimiter = audioCtx.createDynamicsCompressor();
          inputLimiter.threshold.value = -16;
          inputLimiter.knee.value = 4;
          inputLimiter.ratio.value = 10;
          inputLimiter.attack.value = 0.001;
          inputLimiter.release.value = 0.04;

          // 2. Drive Gain (Unity 1.0)
          const micDriveGain = audioCtx.createGain();
          micDriveGain.gain.value = 1.0;

          // 3. Smooth Horn Saturation Node
          micDistortion = audioCtx.createWaveShaper();
          micDistortion.curve = createBalancedSguDistortionCurve();
          micDistortion.oversample = "2x";

          // 4. Highpass filter (cuts low rumble < 320Hz)
          micHighpass = audioCtx.createBiquadFilter();
          micHighpass.type = "highpass";
          micHighpass.frequency.value = 320;

          // 5. Lowpass filter (cuts high sizzle > 2800Hz)
          micLowpass = audioCtx.createBiquadFilter();
          micLowpass.type = "lowpass";
          micLowpass.frequency.value = 2800;

          // 6. Horn Speaker Resonance Peak (~1300Hz, Q 1.5, +6.0dB)
          micPresence = audioCtx.createBiquadFilter();
          micPresence.type = "peaking";
          micPresence.frequency.value = 1300;
          micPresence.Q.value = 1.5;
          micPresence.gain.value = 6.0;

          // 7. Output Broadcast Compressor
          micCompressor = audioCtx.createDynamicsCompressor();
          micCompressor.threshold.value = -20;
          micCompressor.knee.value = 6;
          micCompressor.ratio.value = 4.0;
          micCompressor.attack.value = 0.003;
          micCompressor.release.value = 0.06;

          // 8. Tamed Output Mic Gain (1.8x - prevents phone speaker overloading)
          micGainNode = audioCtx.createGain();
          micGainNode.gain.value = 1.8;

          // Connect Web Audio Nodes
          micSourceNode.connect(inputLimiter);
          inputLimiter.connect(micDriveGain);
          micDriveGain.connect(micDistortion);
          micDistortion.connect(micHighpass);
          micHighpass.connect(micLowpass);
          micLowpass.connect(micPresence);
          micPresence.connect(micCompressor);
          micCompressor.connect(micGainNode);
          micGainNode.connect(masterGainNode);
        } else if (micGainNode) {
          micGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
          micGainNode.gain.setValueAtTime(1.8, audioCtx.currentTime);
        }

        if (micStream) {
          micStream.getAudioTracks().forEach(track => track.enabled = true);
        }
      } catch (err) {
        console.error("Microphone access error:", err);
        isMicActive = false;
        btnMic.classList.remove("active");
        if (lcdStatusText) lcdStatusText.textContent = "ОШИБКА: НЕТ ДОСТУПА К МИКРОФОНУ";
      }
    }

    function stopMicrophone(e) {
      if (e && e.preventDefault) e.preventDefault();
      if (!isMicActive) return;
      isMicActive = false;
      btnMic.classList.remove("active");

      if (micGainNode && audioCtx) {
        micGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
        micGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      }

      // Restore background siren and sounds volume back to 100%
      if (sguSoundsGainNode && audioCtx) {
        const now = audioCtx.currentTime;
        const currentVal = sguSoundsGainNode.gain.value;
        sguSoundsGainNode.gain.cancelScheduledValues(now);
        sguSoundsGainNode.gain.setValueAtTime(currentVal, now);
        sguSoundsGainNode.gain.linearRampToValueAtTime(1.0, now + 0.15);
      }

      if (lcdStatusText) {
        lcdStatusText.textContent = isSirenActive ? "РЕЖИМ: ОСНОВНАЯ СИРЕНА" : "СГУ ДПС ГОТОВ К РАБОТЕ";
      }
    }

    function bindButton(el, fn) {
      el.addEventListener("pointerdown", fn);
    }



    bindButton(btnCrack, triggerCrack);
    bindButton(btnSiren, toggleSiren);
    bindButton(btnSpeed, triggerSpeedSiren);
    bindButton(btnTwo, triggerTwoSiren);
    bindButton(btnCrackSiren, triggerCrackSiren);
    bindButton(btnSecret, triggerSecretSignal);

    btnMic.addEventListener("pointerdown", startMicrophone);
    btnMic.addEventListener("pointerup", stopMicrophone);
    btnMic.addEventListener("pointercancel", stopMicrophone);
    btnMic.addEventListener("pointerleave", stopMicrophone);
    btnMic.addEventListener("contextmenu", e => e.preventDefault());



    let lastTap = 0;
    function handleFullscreen(e) {
      if (e.target.closest(".interactive-control")) return;
      const t = (new Date()).getTime();
      if ((t - lastTap < 300 && t - lastTap > 0) || e.type === "dblclick") {
        if (e) e.preventDefault();
        if (document.fullscreenElement) {
          if (document.exitFullscreen) document.exitFullscreen();
        } else {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      }
      lastTap = t;
    }

    document.body.addEventListener("dblclick", handleFullscreen);
    document.body.addEventListener("touchend", handleFullscreen);
    window.addEventListener("DOMContentLoaded", preloadAudio);
  </script>
</body>
