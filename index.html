<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#07090d">
  <title>Звуковая панель</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: #fff;
      background:
        radial-gradient(circle at 50% 0, rgba(44, 63, 94, .22), transparent 42%),
        #07090d;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    .sound-panel {
      width: min(100%, 520px);
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .sound-btn {
      position: relative;
      min-height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
      border: 2px solid transparent;
      border-radius: 14px;
      outline: 0;
      color: #fff;
      font: inherit;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
      transition: transform 70ms ease, box-shadow 100ms ease, filter 140ms ease;
    }

    .sound-btn:active {
      transform: translateY(4px) scale(.975);
    }

    .sound-btn:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .92);
      outline-offset: 4px;
    }

    .btn-number {
      position: absolute;
      top: 9px;
      left: 11px;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .1em;
      opacity: .72;
    }

    .btn-label {
      font-size: clamp(.9rem, 3.6vw, 1.12rem);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: .07em;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 2px 3px rgba(0, 0, 0, .72);
    }

    .btn-crack {
      background: linear-gradient(145deg, #d97706, #78350f);
      border-color: #fbbf24;
      box-shadow: 0 7px 0 #451a03, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .38);
    }

    .btn-crack.pulsing,
    .btn-crack:active {
      background: linear-gradient(145deg, #f59e0b, #b45309);
      box-shadow: 0 2px 0 #451a03, 0 5px 10px rgba(0, 0, 0, .5), inset 0 1px 3px rgba(255, 255, 255, .55);
    }

    .btn-siren {
      background: linear-gradient(145deg, #b91c1c, #651616);
      border-color: #ef4444;
      box-shadow: 0 7px 0 #450a0a, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-siren.active {
      background: linear-gradient(145deg, #ef2b2b, #991b1b);
      border-color: #fca5a5;
      box-shadow: 0 2px 0 #450a0a, 0 0 26px rgba(239, 68, 68, .72), inset 0 2px 4px rgba(255, 255, 255, .5);
      animation: activePulse .65s infinite alternate;
    }

    .btn-speed {
      background: linear-gradient(145deg, #1d4ed8, #172554);
      border-color: #60a5fa;
      box-shadow: 0 7px 0 #0f183a, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-speed.active,
    .btn-speed:active {
      background: linear-gradient(145deg, #2563eb, #1d4ed8);
      box-shadow: 0 2px 0 #172554, 0 0 24px rgba(37, 99, 235, .72), inset 0 2px 4px rgba(255, 255, 255, .5);
    }

    .btn-two {
      background: linear-gradient(145deg, #0284c7, #0f172a);
      border-color: #38bdf8;
      box-shadow: 0 7px 0 #0c4a6e, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-two.active,
    .btn-two:active {
      background: linear-gradient(145deg, #0ea5e9, #0369a1);
      box-shadow: 0 2px 0 #0c4a6e, 0 0 24px rgba(56, 189, 248, .7), inset 0 2px 4px rgba(255, 255, 255, .5);
    }

    .btn-cracksiren {
      background: linear-gradient(145deg, #15568f, #081d36);
      border-color: #38bdf8;
      box-shadow: 0 7px 0 #040e1a, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-cracksiren.active,
    .btn-cracksiren:active {
      background: linear-gradient(145deg, #0284c7, #0f3661);
      box-shadow: 0 2px 0 #040e1a, 0 0 24px rgba(56, 189, 248, .7), inset 0 2px 4px rgba(255, 255, 255, .5);
    }

    .btn-pull-over {
      background: linear-gradient(145deg, #7c3aed, #3b0764);
      border-color: #c084fc;
      box-shadow: 0 7px 0 #24063d, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-pull-over.active,
    .btn-pull-over:active {
      background: linear-gradient(145deg, #9333ea, #581c87);
      box-shadow: 0 2px 0 #24063d, 0 0 24px rgba(192, 132, 252, .7), inset 0 2px 4px rgba(255, 255, 255, .5);
    }

    .btn-mic {
      grid-column: 1 / -1;
      background: linear-gradient(145deg, #067354, #022c22);
      border-color: #10b981;
      box-shadow: 0 7px 0 #06281e, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .btn-mic.active,
    .btn-mic:active {
      background: linear-gradient(145deg, #059669, #047857);
      border-color: #6ee7b7;
      box-shadow: 0 2px 0 #06281e, 0 0 25px rgba(16, 185, 129, .68), inset 0 2px 4px rgba(255, 255, 255, .5);
      animation: activePulse .55s infinite alternate;
    }

    @keyframes activePulse {
      from { filter: brightness(1); }
      to { filter: brightness(1.28); }
    }

    .category-browser {
      outline: 0;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .category-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .category-title {
      font-size: clamp(1.3rem, 5vw, 1.7rem);
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .category-dots {
      display: flex;
      gap: 7px;
    }

    .category-dot {
      width: 7px;
      height: 7px;
      border: 0;
      border-radius: 50%;
      background: #384154;
      transition: width 180ms ease, background 180ms ease;
    }

    .category-dot.active {
      width: 24px;
      border-radius: 99px;
      background: #8b5cf6;
    }

    .category-content {
      position: relative;
      overflow: hidden;
      transition: height 280ms ease;
    }

    .category-outgoing {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      pointer-events: none;
    }

    .category-incoming {
      position: relative;
      z-index: 1;
    }

    .slide-out-left { animation: slideOutLeft 320ms cubic-bezier(.4, 0, .2, 1) both; }
    .slide-out-right { animation: slideOutRight 320ms cubic-bezier(.4, 0, .2, 1) both; }
    .slide-in-right { animation: slideInRight 320ms cubic-bezier(.22, 1, .36, 1) both; }
    .slide-in-left { animation: slideInLeft 320ms cubic-bezier(.22, 1, .36, 1) both; }
    .title-in-right { animation: titleInRight 320ms cubic-bezier(.22, 1, .36, 1) both; }
    .title-in-left { animation: titleInLeft 320ms cubic-bezier(.22, 1, .36, 1) both; }

    @keyframes slideOutLeft {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(-105%); }
    }

    @keyframes slideOutRight {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(105%); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(105%); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-105%); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes titleInRight {
      from { opacity: 0; transform: translateX(28px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes titleInLeft {
      from { opacity: 0; transform: translateX(-28px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .category-hint {
      margin-top: 14px;
      color: #626d82;
      font-size: .64rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
    }

    .tone-purple {
      background: linear-gradient(145deg, #7e22ce, #3b0764);
      border-color: #c084fc;
      box-shadow: 0 7px 0 #2e1065, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .tone-pink {
      background: linear-gradient(145deg, #be185d, #500724);
      border-color: #f472b6;
      box-shadow: 0 7px 0 #3f071f, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .tone-indigo {
      background: linear-gradient(145deg, #4f46e5, #1e1b4b);
      border-color: #818cf8;
      box-shadow: 0 7px 0 #17143d, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .tone-teal {
      background: linear-gradient(145deg, #0f766e, #042f2e);
      border-color: #2dd4bf;
      box-shadow: 0 7px 0 #022c2b, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .tone-slate {
      background: linear-gradient(145deg, #475569, #0f172a);
      border-color: #94a3b8;
      box-shadow: 0 7px 0 #090f1d, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .tone-panther {
      background: linear-gradient(145deg, #be123c, #4c0519);
      border-color: #fb7185;
      box-shadow: 0 7px 0 #3b0716, 0 12px 20px rgba(0, 0, 0, .42), inset 0 1px 2px rgba(255, 255, 255, .35);
    }

    .tone-gold {
      background: linear-gradient(145deg, #b45309, #78350f);
      border-color: #fbbf24;
      box-shadow: 0 7px 0 #451a03, 0 12px 20px rgba(0, 0, 0, .45), inset 0 1px 2px rgba(255, 255, 255, .4);
    }

    .btn-drop {
      grid-column: 1 / -1;
      position: relative;
      overflow: hidden;
      min-height: 120px;
    }

    .btn-drop .charge-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 6px;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #fef08a);
      box-shadow: 0 0 12px #fbbf24;
      pointer-events: none;
      transition: width 80ms linear;
    }

    .btn-drop.charging {
      animation: chargePulse 0.35s infinite alternate;
      border-color: #fef08a;
      box-shadow: 0 2px 0 #451a03, 0 0 35px rgba(251, 191, 36, 0.85), inset 0 0 15px rgba(253, 224, 71, 0.4);
    }

    .btn-drop.charging .charge-bar {
      width: 100%;
      transition: width 3.6s cubic-bezier(0.1, 0.8, 0.2, 1);
    }

    .btn-drop.exploded {
      animation: dropExplode 0.45s ease-out;
    }

    @keyframes chargePulse {
      from { filter: brightness(1.1) saturate(1.2); transform: translateY(3px) scale(0.985); }
      to { filter: brightness(1.4) saturate(1.6); transform: translateY(3px) scale(1.015); }
    }

    @keyframes dropExplode {
      0% { transform: scale(0.94); filter: brightness(2.2) contrast(1.3); }
      40% { transform: scale(1.05); filter: brightness(1.6); box-shadow: 0 0 45px rgba(251, 191, 36, 1); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .sound-btn.pad-hit {
      animation: padHit 130ms ease-out;
    }

    @keyframes padHit {
      0% { transform: translateY(4px) scale(0.95); filter: brightness(1.5); }
      100% { transform: translateY(0) scale(1); filter: brightness(1); }
    }

    .btn-hint-badge {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .05em;
      opacity: .6;
      text-transform: uppercase;
      pointer-events: none;
    }

    .sound-btn {
      touch-action: manipulation;
    }

    .sound-btn.active {
      filter: brightness(1.3);
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .75), 0 0 24px color-mix(in srgb, currentColor 32%, transparent);
    }

    .volume-control {
      margin-top: 26px;
      padding: 18px 20px 20px;
      border: 1px solid #293143;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(26, 31, 41, .94), rgba(13, 16, 23, .96));
      box-shadow: 0 12px 28px rgba(0, 0, 0, .36), inset 0 1px 0 rgba(255, 255, 255, .07);
    }

    .volume-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      color: #aeb8ca;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .volume-value {
      min-width: 68px;
      color: #fff;
      font-size: .9rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
      text-align: right;
    }

    .volume-slider {
      --progress: 19.84%;
      width: 100%;
      height: 26px;
      display: block;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      outline: 0;
      background: transparent;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-runnable-track {
      height: 8px;
      border: 1px solid #303a4d;
      border-radius: 999px;
      background: linear-gradient(90deg, #7c3aed 0 var(--progress), #202633 var(--progress) 100%);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .65);
    }

    .volume-slider::-webkit-slider-thumb {
      width: 24px;
      height: 24px;
      margin-top: -9px;
      appearance: none;
      -webkit-appearance: none;
      border: 3px solid #8b5cf6;
      border-radius: 50%;
      background: #f8fafc;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .65), 0 0 0 5px rgba(139, 92, 246, .15);
      transition: transform 100ms ease, box-shadow 100ms ease;
    }

    .volume-slider::-moz-range-track {
      height: 8px;
      border: 1px solid #303a4d;
      border-radius: 999px;
      background: #202633;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .65);
    }

    .volume-slider::-moz-range-progress {
      height: 8px;
      border-radius: 999px;
      background: #7c3aed;
    }

    .volume-slider::-moz-range-thumb {
      width: 19px;
      height: 19px;
      border: 3px solid #8b5cf6;
      border-radius: 50%;
      background: #f8fafc;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .65), 0 0 0 5px rgba(139, 92, 246, .15);
    }

    .volume-slider:active::-webkit-slider-thumb {
      transform: scale(1.12);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .7), 0 0 0 7px rgba(139, 92, 246, .22);
    }

    .volume-slider:focus-visible::-webkit-slider-thumb {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .load-error {
      display: none;
      margin-top: 14px;
      color: #fca5a5;
      font-size: .78rem;
      line-height: 1.4;
      text-align: center;
    }

    @media (max-width: 430px) {
      body { padding: 16px 12px; }
      .buttons-grid { gap: 11px; }
      .sound-btn { min-height: 96px; border-radius: 12px; }
      .volume-control { margin-top: 22px; padding-inline: 16px; }
    }

    @media (max-height: 680px) and (orientation: landscape) {
      body { align-items: start; }
      .sound-panel { width: min(100%, 760px); }
      .buttons-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .sound-btn { min-height: 88px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="sound-panel">
    <section class="category-browser" id="categoryBrowser" aria-label="Категории звуков" tabindex="0">
      <div class="category-heading">
        <h1 class="category-title" id="categoryTitle" aria-live="polite">ДПС</h1>
        <div class="category-dots" id="categoryDots" aria-hidden="true"></div>
      </div>
      <div class="category-content" id="categoryContent">
        <div class="buttons-grid" id="buttonsGrid" aria-label="Звуки категории ДПС"></div>
      </div>
      <p class="category-hint">Смахните для смены категории • Клавиши 1-5 / Space</p>
    </section>

    <section class="volume-control" aria-label="Громкость">
      <div class="volume-header">
        <label for="volumeSlider">Громкость</label>
        <output class="volume-value" id="volumeValue" for="volumeSlider">100%</output>
      </div>
      <input
        class="volume-slider"
        id="volumeSlider"
        type="range"
        min="1"
        max="500"
        value="100"
        step="1"
        aria-valuetext="100 процентов"
      >
    </section>

    <p class="load-error" id="loadError" role="alert">
      Не удалось загрузить звуки. Откройте страницу через локальный сервер.
    </p>
  </main>

  <script src="./app.js?v=7"></script>
</body>
</html>
