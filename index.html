<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Пульт СГУ ДПС</title>
  <style>
    /* Reset & global styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: #050608;
      background-image: 
        radial-gradient(ellipse at 50% 20%, rgba(13, 71, 161, 0.25) 0%, rgba(0, 0, 0, 0.95) 70%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 1px, transparent 1px, transparent 3px);
      color: #ffffff;
      font-family: 'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Police Lightbar / Strobe Top Banner */
    .strobe-bar {
      width: 100%;
      max-width: 460px;
      height: 16px;
      border-radius: 8px 8px 0 0;
      display: flex;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      border: 2px solid #1a202c;
      border-bottom: none;
    }

    .strobe-left {
      flex: 1;
      background: #7f1d1d;
      transition: background 0.1s ease;
    }

    .strobe-right {
      flex: 1;
      background: #1e3a8a;
      transition: background 0.1s ease;
    }

    /* Active Flashing Police Strobe Animation */
    body.strobe-active .strobe-left {
      animation: flashRed 0.4s infinite alternate;
    }

    body.strobe-active .strobe-right {
      animation: flashBlue 0.4s infinite alternate-reverse;
    }

    @keyframes flashRed {
      0% { background: #ff0000; box-shadow: 0 0 25px #ff0000; }
      100% { background: #500000; box-shadow: none; }
    }

    @keyframes flashBlue {
      0% { background: #0055ff; box-shadow: 0 0 25px #0055ff; }
      100% { background: #001155; box-shadow: none; }
    }

    /* Main Console Chassis */
    .sgu-console {
      width: 100%;
      max-width: 460px;
      background: #0f1218;
      background-image: linear-gradient(180deg, #181d26 0%, #0b0d12 100%);
      border: 3px solid #2a3242;
      border-radius: 0 0 16px 16px;
      padding: 20px 16px;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.95),
        inset 0 2px 3px rgba(255, 255, 255, 0.15),
        inset 0 -3px 8px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    /* Decorative Corner Screws */
    .screw {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4b5563, #1f2937);
      border: 1px solid #111827;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
    }
    .screw::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 1px;
      width: 8px;
      height: 2px;
      background: #111827;
    }
    .screw-tl { top: 8px; left: 8px; }
    .screw-tr { top: 8px; right: 8px; }
    .screw-bl { bottom: 8px; left: 8px; }
    .screw-br { bottom: 8px; right: 8px; }

    /* DPS Livery Header Banner */
    .dps-header {
      background: linear-gradient(90deg, #0d47a1 0%, #1565c0 50%, #0d47a1 100%);
      border: 2px solid #1e88e5;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }

    .dps-header::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: #d32f2f;
    }

    .dps-header::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: #d32f2f;
    }

    .dps-title {
      display: flex;
      flex-direction: column;
      padding-left: 6px;
    }

    .dps-title h1 {
      font-size: 1.4rem;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #000;
    }

    .dps-title span {
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: #ffeb3b;
      font-weight: bold;
      text-transform: uppercase;
    }

    /* Status Indicators */
    .status-leds {
      display: flex;
      gap: 10px;
    }

    .led-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .led-label {
      font-size: 0.55rem;
      color: #90caf9;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #151c24;
      border: 1px solid #000;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.9);
      transition: all 0.15s ease;
    }

    .led.green.on {
      background: #00ff44;
      box-shadow: 0 0 12px #00ff44, inset 0 -1px 2px rgba(0,0,0,0.4);
    }

    .led.red.on {
      background: #ff0033;
      box-shadow: 0 0 14px #ff0033, inset 0 -1px 2px rgba(0,0,0,0.4);
    }

    .led.blue.on {
      background: #0088ff;
      box-shadow: 0 0 14px #0088ff, inset 0 -1px 2px rgba(0,0,0,0.4);
    }

    /* LCD Screen Display */
    .lcd-screen {
      background: #04090f;
      border: 2px solid #1a2636;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 18px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.95);
      font-family: 'Courier New', monospace;
    }

    .lcd-row-1 {
      display: flex;
      justify-content: space-between;
      color: #00e5ff;
      font-size: 0.85rem;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(0, 229, 255, 0.6);
      margin-bottom: 4px;
    }

    .lcd-row-2 {
      color: #768b9e;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 1px;
      min-height: 1.2em;
    }

    .lcd-row-2.active-alert {
      color: #ff1744;
      text-shadow: 0 0 8px rgba(255, 23, 68, 0.8);
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #0d1520;
      margin-top: 6px;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #d32f2f, #1976d2, #00ff44);
      transition: width 0.2s ease;
    }

    /* Buttons Grid Layout */
    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    /* Tactical SGU Button Base */
    .sgu-btn {
      position: relative;
      height: 110px;
      border-radius: 12px;
      border: 2px solid transparent;
      outline: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      gap: 4px;
      transition: transform 0.05s ease, box-shadow 0.05s ease, filter 0.15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .sgu-btn:active {
      transform: translateY(4px) scale(0.97);
    }

    .btn-badge {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 0.7rem;
      font-weight: bold;
      opacity: 0.7;
      letter-spacing: 1px;
    }

    .btn-main-text {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 2px 2px 2px rgba(0,0,0,0.9);
      line-height: 1.1;
      text-align: center;
    }

    .btn-sub-text {
      font-size: 0.62rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* Button 1: КРЯКАЛКА (Tactical Amber/Yellow) */
    .btn-crack {
      background: linear-gradient(145deg, #d97706 0%, #92400e 100%);
      color: #ffffff;
      border-color: #fbbf24;
      box-shadow: 
        0 7px 0 #451a03,
        0 10px 15px rgba(0, 0, 0, 0.8),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    .btn-crack:active, .btn-crack.pulsing {
      background: linear-gradient(145deg, #f59e0b 0%, #b45309 100%);
      box-shadow: 
        0 2px 0 #451a03,
        0 4px 8px rgba(0, 0, 0, 0.8),
        inset 0 1px 3px rgba(255, 255, 255, 0.6);
    }

    /* Button 2: ОСНОВНАЯ СИРЕНА (Police Red) */
    .btn-siren {
      background: linear-gradient(145deg, #b91c1c 0%, #7f1d1d 100%);
      color: #ffffff;
      border-color: #ef4444;
      box-shadow: 
        0 7px 0 #450a0a,
        0 10px 15px rgba(0, 0, 0, 0.8),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    .btn-siren.active {
      background: linear-gradient(145deg, #dc2626 0%, #991b1b 100%);
      border-color: #ff8888;
      box-shadow: 
        0 2px 0 #450a0a,
        0 0 25px rgba(239, 68, 68, 0.95),
        inset 0 2px 4px rgba(255, 255, 255, 0.6);
      animation: pulseRedBtn 0.6s infinite alternate;
    }

    @keyframes pulseRedBtn {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.3); }
    }

    /* Button 3: БЫСТРАЯ СИРЕНА (Police Blue) */
    .btn-speed {
      background: linear-gradient(145deg, #1d4ed8 0%, #1e3a8a 100%);
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 
        0 7px 0 #172554,
        0 10px 15px rgba(0, 0, 0, 0.8),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    .btn-speed:active, .btn-speed.active {
      background: linear-gradient(145deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 
        0 2px 0 #172554,
        0 0 22px rgba(37, 99, 235, 0.95),
        inset 0 2px 4px rgba(255, 255, 255, 0.6);
    }

    /* Button 4: ДВОЙНАЯ СИРЕНА (Red & Blue Accent) */
    .btn-two {
      background: linear-gradient(145deg, #0284c7 0%, #0f172a 100%);
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 
        0 7px 0 #0c4a6e,
        0 10px 15px rgba(0, 0, 0, 0.8),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    .btn-two:active, .btn-two.active {
      background: linear-gradient(145deg, #0369a1 0%, #0284c7 100%);
      box-shadow: 
        0 2px 0 #0c4a6e,
        0 0 22px rgba(56, 189, 248, 0.95),
        inset 0 2px 4px rgba(255, 255, 255, 0.6);
    }

    /* Master Controls Footer */
    .console-footer {
      background: #090c10;
      border: 2px solid #1e293b;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .vol-text {
      font-size: 0.7rem;
      font-weight: bold;
      color: #94a3b8;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .vol-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 4px;
      background: #1e293b;
      outline: none;
    }

    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: #d32f2f;
      border: 2px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(211, 47, 47, 0.8);
    }

    /* Hint Bar */
    .hint-bar {
      margin-top: 18px;
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid #1e293b;
      font-family: sans-serif;
    }

    /* CORS Notification */
    .cors-box {
      display: none;
      background: #3f0e0e;
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.72rem;
      margin-top: 10px;
      text-align: center;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <!-- Police Lightbar Strobe Bar Header -->
  <div class="strobe-bar">
    <div class="strobe-left"></div>
    <div class="strobe-right"></div>
  </div>

  <!-- SGU Console Base -->
  <div class="sgu-console">
    
    <!-- Screw accents -->
    <div class="screw screw-tl"></div>
    <div class="screw screw-tr"></div>
    <div class="screw screw-bl"></div>
    <div class="screw screw-br"></div>

    <!-- DPS Livery Banner Header -->
    <div class="dps-header">
      <div class="dps-title">
        <h1>ДПС ГИБДД</h1>
        <span>СПЕЦСИГНАЛ СГУ-120</span>
      </div>

      <div class="status-leds">
        <div class="led-box">
          <div class="led green on" id="ledPower"></div>
          <span class="led-label">СЕТЬ</span>
        </div>
        <div class="led-box">
          <div class="led red" id="ledSiren"></div>
          <span class="led-label">СИРЕНА</span>
        </div>
        <div class="led-box">
          <div class="led blue" id="ledAudio"></div>
          <span class="led-label">ЗВУК</span>
        </div>
      </div>
    </div>

    <!-- LCD Display -->
    <div class="lcd-screen">
      <div class="lcd-row-1">
        <span>СТАТУС: ГОТОВ</span>
        <span id="lcdVolumeText">ГРОМКОСТЬ: 100%</span>
      </div>
      <div class="lcd-row-2" id="lcdStatusText">ИНИЦИАЛИЗАЦИЯ...</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- 2x2 Buttons Grid -->
    <div class="buttons-grid">
      <!-- Button 1: Крякалка -->
      <button class="sgu-btn btn-crack interactive-control" id="btnCrack">
        <span class="btn-badge">01</span>
        <span class="btn-main-text">КРЯКАЛКА</span>
        <span class="btn-sub-text">CRACK / HORN</span>
      </button>

      <!-- Button 2: Основная сирена -->
      <button class="sgu-btn btn-siren interactive-control" id="btnSiren">
        <span class="btn-badge">02</span>
        <span class="btn-main-text">СИРЕНА</span>
        <span class="btn-sub-text">ОСНОВНАЯ (LOOP)</span>
      </button>

      <!-- Button 3: Быстрая сирена -->
      <button class="sgu-btn btn-speed interactive-control" id="btnSpeed">
        <span class="btn-badge">03</span>
        <span class="btn-main-text">БЫСТРАЯ</span>
        <span class="btn-sub-text">WAIL / YELP</span>
      </button>

      <!-- Button 4: Двойная сирена -->
      <button class="sgu-btn btn-two interactive-control" id="btnTwo">
        <span class="btn-badge">04</span>
        <span class="btn-main-text">ДВОЙНАЯ</span>
        <span class="btn-sub-text">TWO SIREN</span>
      </button>
    </div>

    <!-- Master Volume Controls -->
    <div class="console-footer">
      <div class="volume-box">
        <span class="vol-text">ЗВУК:</span>
        <input type="range" min="0" max="100" value="100" class="vol-slider interactive-control" id="volRange">
      </div>
    </div>

    <!-- Local CORS Alert -->
    <div class="cors-box" id="corsBox">
      ⚠️ Ошибка чтения локальных файлов по file://. Запустите через локальный сервер (Live Server / python -m http.server).
    </div>

  </div>

  <!-- Fullscreen Hint -->
  <div class="hint-bar">
    Двойной клик/тап в любом месте — Полноэкранный режим
  </div>

  <script>
    /* ==========================================================================
       СГУ ДПС - WEB AUDIO API LOGIC
       ========================================================================== */

    const AUDIO_FILES = {
      crack: './crack.mp3',
      siren: './siren.mp3',
      speed_siren: './speed_siren.mp3',
      two_siren: './two_siren.mp3'
    };

    let audioCtx = null;
    let masterGainNode = null;
    const audioBuffers = {};

    let sirenSourceNode = null;
    let isSirenActive = false;

    // DOM References
    const lcdStatusText = document.getElementById('lcdStatusText');
    const progressBar = document.getElementById('progressBar');
    const ledAudio = document.getElementById('ledAudio');
    const ledSiren = document.getElementById('ledSiren');
    const corsBox = document.getElementById('corsBox');
    const lcdVolumeText = document.getElementById('lcdVolumeText');

    const btnCrack = document.getElementById('btnCrack');
    const btnSiren = document.getElementById('btnSiren');
    const btnSpeed = document.getElementById('btnSpeed');
    const btnTwo = document.getElementById('btnTwo');
    const volRange = document.getElementById('volRange');

    // Ensure Audio Context
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        masterGainNode = audioCtx.createGain();
        masterGainNode.gain.value = volRange.value / 100;
        masterGainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Audio Preloader
    async function preloadAudio() {
      const keys = Object.keys(AUDIO_FILES);
      let loaded = 0;

      lcdStatusText.textContent = 'ЗАГРУЗКА АУДИО БУФЕРОВ...';
      const tempCtx = new (window.AudioContext || window.webkitAudioContext)();

      for (const key of keys) {
        try {
          const res = await fetch(AUDIO_FILES[key]);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const buffer = await res.arrayBuffer();
          audioBuffers[key] = await tempCtx.decodeAudioData(buffer);

          loaded++;
          const pct = Math.round((loaded / keys.length) * 100);
          progressBar.style.width = pct + '%';
          lcdStatusText.textContent = `ЗАГРУЗКА: ${pct}% (${key}.mp3)`;
        } catch (err) {
          console.error(err);
          lcdStatusText.textContent = 'ОШИБКА ЗАГРУЗКИ ФАЙЛОВ';
          lcdStatusText.classList.add('active-alert');
          if (window.location.protocol === 'file:') {
            corsBox.style.display = 'block';
          }
          return;
        }
      }

      tempCtx.close();
      lcdStatusText.textContent = 'СГУ ДПС ГОТОВ К РАБОТЕ';
      ledAudio.classList.add('on');
    }

    // Update Strobe Light Bar Status
    function updateStrobeState() {
      if (isSirenActive) {
        document.body.classList.add('strobe-active');
      } else {
        document.body.classList.remove('strobe-active');
      }
    }

    // Button 1: КРЯКАЛКА (Polyphonic Layered)
    function triggerCrack(e) {
      if (e) e.preventDefault();
      initAudioContext();
      if (!audioBuffers.crack) return;

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffers.crack;
      source.connect(masterGainNode);
      source.start(0);

      btnCrack.classList.add('pulsing');
      setTimeout(() => btnCrack.classList.remove('pulsing'), 150);
      lcdStatusText.textContent = 'СИГНАЛ: КРЯКАЛКА';
    }

    // Button 2: ОСНОВНАЯ СИРЕНА (Loop Toggle)
    function toggleSiren(e) {
      if (e) e.preventDefault();
      initAudioContext();
      if (!audioBuffers.siren) return;

      if (isSirenActive) {
        if (sirenSourceNode) {
          try { sirenSourceNode.stop(); } catch(err) {}
          sirenSourceNode.disconnect();
          sirenSourceNode = null;
        }
        isSirenActive = false;
        btnSiren.classList.remove('active');
        ledSiren.classList.remove('on');
        lcdStatusText.textContent = 'СИРЕНА ВЫКЛЮЧЕНА';
      } else {
        sirenSourceNode = audioCtx.createBufferSource();
        sirenSourceNode.buffer = audioBuffers.siren;
        sirenSourceNode.loop = true;
        sirenSourceNode.connect(masterGainNode);
        sirenSourceNode.start(0);

        isSirenActive = true;
        btnSiren.classList.add('active');
        ledSiren.classList.add('on');
        lcdStatusText.textContent = 'РЕЖИМ: ОСНОВНАЯ СИРЕНА';
      }
      updateStrobeState();
    }

    // Button 3: БЫСТРАЯ СИРЕНА (Polyphonic Layered)
    function triggerSpeedSiren(e) {
      if (e) e.preventDefault();
      initAudioContext();
      if (!audioBuffers.speed_siren) return;

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffers.speed_siren;
      source.connect(masterGainNode);

      btnSpeed.classList.add('active');
      lcdStatusText.textContent = 'РЕЖИМ: БЫСТРАЯ СИРЕНА';

      source.onended = () => {
        btnSpeed.classList.remove('active');
        if (!isSirenActive) {
          lcdStatusText.textContent = 'СГУ ДПС ГОТОВ К РАБОТЕ';
        }
      };

      source.start(0);
    }

    // Button 4: ДВОЙНАЯ СИРЕНА (Polyphonic Layered)
    function triggerTwoSiren(e) {
      if (e) e.preventDefault();
      initAudioContext();
      if (!audioBuffers.two_siren) return;

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffers.two_siren;
      source.connect(masterGainNode);

      btnTwo.classList.add('active');
      lcdStatusText.textContent = 'РЕЖИМ: ДВОЙНАЯ СИРЕНА';

      source.onended = () => {
        btnTwo.classList.remove('active');
        if (!isSirenActive) {
          lcdStatusText.textContent = 'СГУ ДПС ГОТОВ К РАБОТЕ';
        }
      };

      source.start(0);
    }

    // Bind Instant Touch Handlers
    function bindButton(elem, fn) {
      elem.addEventListener('pointerdown', fn);
    }

    bindButton(btnCrack, triggerCrack);
    bindButton(btnSiren, toggleSiren);
    bindButton(btnSpeed, triggerSpeedSiren);
    bindButton(btnTwo, triggerTwoSiren);

    // Volume Control
    volRange.addEventListener('input', (e) => {
      const v = e.target.value;
      if (masterGainNode) masterGainNode.gain.value = v / 100;
      lcdVolumeText.textContent = `ГРОМКОСТЬ: ${v}%`;
    });

    // Fullscreen API (Double click / tap)
    let lastTap = 0;
    function handleFullscreen(e) {
      if (e.target.closest('.interactive-control')) return;
      const now = new Date().getTime();
      if ((now - lastTap < 300 && now - lastTap > 0) || e.type === 'dblclick') {
        if (e) e.preventDefault();
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      }
      lastTap = now;
    }

    document.body.addEventListener('dblclick', handleFullscreen);
    document.body.addEventListener('touchend', handleFullscreen);

    // Run Preloader
    window.addEventListener('DOMContentLoaded', preloadAudio);
  </script>
</body>
</html>
